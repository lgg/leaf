name: Leaf desktop Windows — self-hosted

on:
  push:
    branches: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaf-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    if: github.repository == 'lgg/leaf'
    runs-on: [self-hosted, leaf-runner-ci]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Mask local directories before commands
        run: |
          foreach ($key in @('GITHUB_WORKSPACE','RUNNER_WORKSPACE','RUNNER_TEMP','USERPROFILE','LOCALAPPDATA','APPDATA','TEMP','TMP')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value -and $value.Length -gt 2) { Write-Output "::add-mask::$value" }
          }

      - name: Verify preinstalled tools (no installations)
        run: |
          foreach ($tool in @('git','node','cargo','rustc')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing preinstalled tool: $tool. No installation attempted."
            }
            Write-Output "$tool is available"
          }
          node --version
          rustc --version
          cargo --version

      - name: Fetch only this trusted repository commit (quiet)
        run: |
          git init -q 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Git initialization failed." }
          if (-not (git remote)) { git remote add origin https://github.com/lgg/leaf.git }
          git fetch -q --depth=1 origin $env:GITHUB_SHA 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Git fetch failed." }
          git checkout -q --detach FETCH_HEAD 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Git checkout failed." }

      - name: Run JavaScript regression tests and stage desktop
        run: |
          node --test tests/leaf.test.cjs tests/desktop.test.cjs *> "$env:RUNNER_TEMP/leaf-node-tests.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::JavaScript regression tests failed. Local diagnostics were not published."
            throw "JavaScript tests failed."
          }
          Write-Output "JavaScript regression tests passed"
          node desktop/stage.cjs *> "$env:RUNNER_TEMP/leaf-desktop-stage.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Desktop staging failed. Local diagnostics were not published."
            throw "Desktop staging failed."
          }
          Write-Output "Desktop staging passed"

      - name: Test native Rust code using existing Cargo
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml *> "$env:RUNNER_TEMP/leaf-cargo-test.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Native Rust tests failed. Diagnostics retained on runner, not published with local paths."
            throw "Native Rust tests failed."
          }
          Write-Output "Native Rust tests passed"

      - name: Compile Windows desktop executable
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml *> "$env:RUNNER_TEMP/leaf-cargo-build.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Windows native build failed. Diagnostics retained on runner, not published with local paths."
            throw "Windows native build failed."
          }
          if (-not (Test-Path 'src-tauri/target/release/leaf-desktop.exe')) {
            throw "Expected Windows binary is missing."
          }
          Write-Output "Windows binary compiled successfully"

      - name: Package NSIS if Tauri CLI is already provisioned
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            Write-Output "::warning::Missing preinstalled cargo-tauri CLI; installer skipped without installing tools."
            exit 0
          }
          cargo tauri build --bundles nsis --ci *> "$env:RUNNER_TEMP/leaf-cargo-bundle.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::NSIS packaging failed. Diagnostics retained on runner."
            throw "NSIS packaging failed."
          }
          Write-Output "NSIS packaged; no GitHub Release has been published."

      - name: Retain Windows binary for smoke testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: leaf-windows-smoke-test
          path: src-tauri/target/release/leaf-desktop.exe
          if-no-files-found: error
          retention-days: 7

      - name: Retain installer when available (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: leaf-windows-installer-smoke-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7
