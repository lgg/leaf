name: Leaf macOS runner — read-only prerequisites

on:
  push:
    branches:
      - diagnostics/macos-runner-readonly

permissions:
  contents: read

jobs:
  inspect-tools:
    if: github.repository == 'lgg/leaf'
    runs-on: [self-hosted, macOS, leaf-runner-macos-ci]
    timeout-minutes: 5
    env:
      RUSTUP_AUTO_INSTALL: "0"
      CARGO_NET_OFFLINE: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check preinstalled tools only — no checkout, downloads or installation
        run: |
          set -uo pipefail
          missing=0
          if [ "$(uname -s)" = Darwin ]; then
            echo "macOS: yes; architecture: $(uname -m)"
          else
            echo "::error::Runner is not macOS"
            exit 1
          fi

          for tool in git node cargo rustc rustup cargo-tauri sips iconutil lipo tar hdiutil codesign xcode-select xcrun; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "PRESENT: $tool"
            else
              echo "::warning::MISSING: $tool"
              missing=1
            fi
          done

          if command -v xcode-select >/dev/null 2>&1; then
            if xcode-select -p >/dev/null 2>&1; then
              echo "PRESENT: selected Apple developer tools"
              if command -v xcrun >/dev/null 2>&1 && xcrun --sdk macosx --show-sdk-version >/dev/null 2>&1; then
                echo "PRESENT: macOS SDK"
              else
                echo "::warning::MISSING: macOS SDK"
                missing=1
              fi
            else
              echo "::warning::MISSING: selected Apple developer tools"
              missing=1
            fi
          fi

          if command -v rustup >/dev/null 2>&1; then
            targets="$(rustup target list --installed 2>/dev/null || true)"
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              if printf '%s\n' "$targets" | grep -Fxq "$target"; then
                echo "PRESENT: Rust target $target"
              else
                echo "::warning::MISSING: Rust target $target"
                missing=1
              fi
            done
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::macOS prerequisites missing. No software was installed or downloaded."
            exit 1
          fi
          echo "All listed macOS build prerequisites are already present."

      - name: Look for tools outside service PATH — read-only
        if: always()
        run: |
          set -uo pipefail
          found() {
            local label="$1"
            shift
            local candidate
            for candidate in "$@"; do
              if [ -x "$candidate" ]; then
                echo "INSTALLED_OUTSIDE_PATH: $label"
                return 0
              fi
            done
            echo "NOT_FOUND_IN_COMMON_PATHS: $label"
            return 0
          }
          found "node" /opt/homebrew/bin/node /usr/local/bin/node \
            /usr/local/opt/node/bin/node "$HOME"/.nvm/versions/node/*/bin/node \
            "$HOME"/.volta/bin/node "$HOME"/.asdf/shims/node
          found "cargo" "$HOME"/.cargo/bin/cargo /usr/local/bin/cargo /opt/homebrew/bin/cargo
          found "rustc" "$HOME"/.cargo/bin/rustc /usr/local/bin/rustc /opt/homebrew/bin/rustc
          found "rustup" "$HOME"/.cargo/bin/rustup /usr/local/bin/rustup /opt/homebrew/bin/rustup
          found "cargo-tauri" "$HOME"/.cargo/bin/cargo-tauri /usr/local/bin/cargo-tauri /opt/homebrew/bin/cargo-tauri
          for item in \
            /Library/Developer/CommandLineTools/usr/bin/clang \
            /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild; do
            if [ -x "$item" ]; then
              echo "INSTALLED_OUTSIDE_PATH: Apple developer tools (not selected or not on PATH)"
            fi
          done
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            any=no
            for target in "$HOME"/.rustup/toolchains/*/lib/rustlib/"$arch"/lib; do
              if [ -d "$target" ]; then any=yes; break; fi
            done
            echo "CACHED_RUST_TARGET_$arch: $any"
          done
