[package]
name = "leaf-desktop"
version = "1.11.1"
description = "Leaf — distraction-free Markdown editor"
authors = ["Dan (original Leaf)", "lgg (fork)"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
open = "5"
url = "2"
